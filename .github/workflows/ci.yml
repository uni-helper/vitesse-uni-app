name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    strategy:
      matrix:
        node_version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_cmd: [build, build wx, build app]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@${{matrix.node_version}}
      - run: pnpm install
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run ${{ matrix.build_cmd }}
